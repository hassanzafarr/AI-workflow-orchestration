# API gateway: REST + WebSocket for the dashboard, manual overrides, and the self-healing
# reconciler. Stateless; its service account may only read/patch worker scaling objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wfo-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wfo-api-scaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["wfo-worker"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["wfo-worker"]
    verbs: ["get", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["wfo-worker"]
    verbs: ["get", "patch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    resourceNames: ["wfo-worker"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wfo-api-scaler
subjects:
  - kind: ServiceAccount
    name: wfo-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wfo-api-scaler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfo-api
  labels: { app.kubernetes.io/name: wfo-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: wfo-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wfo-api, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: wfo-api
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: api
          image: wfo-backend
          command: ["node", "dist/api/main.js"]
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: wfo-config }
            - secretRef: { name: wfo-secrets }
          env:
            - { name: PORT, value: "3000" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: wfo-api
spec:
  selector: { app.kubernetes.io/name: wfo-api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wfo-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wfo-api }
