apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfo-web
  labels: { app.kubernetes.io/name: wfo-web, app.kubernetes.io/component: dashboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: wfo-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wfo-web, app.kubernetes.io/component: dashboard }
    spec:
      containers:
        - name: web
          image: wfo-web
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: API_UPSTREAM, value: "wfo-api:3000" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wfo-web
spec:
  selector: { app.kubernetes.io/name: wfo-web }
  ports:
    - { name: http, port: 80, targetPort: http }
