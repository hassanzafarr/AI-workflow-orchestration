apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wfo-postgres
  labels: { app.kubernetes.io/name: wfo-postgres }
spec:
  serviceName: wfo-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wfo-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wfo-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: wfo }
            - { name: POSTGRES_DB, value: wfo }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: wfo-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "wfo", "-d", "wfo"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: wfo-postgres
spec:
  selector: { app.kubernetes.io/name: wfo-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
