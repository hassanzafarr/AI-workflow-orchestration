apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wfo-redis
  labels: { app.kubernetes.io/name: wfo-redis }
spec:
  serviceName: wfo-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wfo-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wfo-redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # BullMQ requires noeviction so queued jobs are never silently dropped.
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: wfo-redis
spec:
  selector: { app.kubernetes.io/name: wfo-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
