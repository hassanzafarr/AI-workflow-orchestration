# Fallback autoscaling without KEDA: a plain HPA on worker CPU (needs metrics-server).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - hpa.yaml
patches:
  - target: { kind: ConfigMap, name: wfo-config }
    patch: |-
      - op: replace
        path: /data/SCALER_KIND
        value: hpa
